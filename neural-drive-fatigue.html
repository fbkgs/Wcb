<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Complete meeting-preparation notes for Dr. Gianluca Vernillo's Human Performance Laboratory: fatigue, TMS, ultra-marathon physiology, research fit, interview answers, and questions to ask.">
<title>Vernillo Human Performance Laboratory — Complete Meeting Prep</title>
<style>
:root{--bg:#f4f6fb;--paper:#fff;--ink:#172033;--muted:#657087;--line:#dce3ef;--blue:#3157d5;--dark:#14285f;--soft:#eef2ff;--violet:#6957c7;--violet-soft:#f4f1ff;--green-soft:#edf8f2;--shadow:0 18px 46px rgba(31,48,82,.08);--r:22px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 10% 0%,rgba(49,87,213,.1),transparent 30rem),var(--bg);font:16px/1.72 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{width:min(1240px,calc(100% - 32px));margin:auto;padding:34px 0 72px}.hero{position:relative;overflow:hidden;padding:clamp(30px,5vw,58px);border-radius:30px;color:#fff;background:linear-gradient(135deg,#13255c,#3157d5 62%,#6c7de7);box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:420px;height:420px;right:-160px;top:-210px;border-radius:50%;background:rgba(255,255,255,.09)}.kicker,.hero h1,.hero-intro,.hero-actions{position:relative;z-index:1}.kicker{margin:0 0 9px;font-size:.78rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase;opacity:.8}.hero h1{margin:0;max-width:900px;font-size:clamp(2.2rem,5vw,4.45rem);line-height:1.02;letter-spacing:-.05em}.hero-intro{max-width:920px;margin-top:22px;font-size:1.08rem;color:rgba(255,255,255,.94)}.hero-intro p{margin:0}.hero strong{color:#fff}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:9px 13px;color:#fff;background:rgba(255,255,255,.11);font:inherit;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;align-items:start;margin-top:24px}.toc{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.96);box-shadow:0 10px 28px rgba(31,48,82,.05)}.toc-title{margin:0 0 12px;font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--muted)}.toc nav{display:grid;gap:5px}.toc a{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:7px 8px;border-radius:9px;text-decoration:none;font-size:.82rem;line-height:1.35;color:#3e4b63}.toc a:hover{background:var(--soft);color:var(--dark)}.toc-num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--soft);color:var(--blue);font-weight:800;font-size:.72rem}.article-flow{display:grid;gap:20px}.content-card{padding:clamp(23px,4vw,36px);border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.97);box-shadow:0 10px 30px rgba(31,48,82,.045)}.content-card>h1,.content-card>h2{scroll-margin-top:20px;margin:0 0 20px;font-size:clamp(1.5rem,3vw,2rem);line-height:1.2;letter-spacing:-.025em}h3{scroll-margin-top:18px;margin:30px 0 10px;font-size:1.16rem;line-height:1.35;color:#1c2b4e}p{margin:0 0 16px}p:last-child{margin-bottom:0}strong{color:#101a2c}ul,ol{padding-left:1.4rem;margin:12px 0 20px}li{margin:7px 0}blockquote{margin:18px 0;padding:18px 20px;border-left:5px solid var(--blue);border-radius:13px;background:#f7f9ff;color:#22315a;font-size:1.02rem}blockquote p{margin:0}.content-card:nth-child(3n+1) blockquote{background:var(--soft)}.content-card:nth-child(3n+2) blockquote{background:var(--violet-soft);border-left-color:var(--violet)}.content-card:nth-child(3n) blockquote{background:var(--green-soft);border-left-color:#2b8a62}hr{border:0;border-top:1px solid var(--line);margin:26px 0}.loading,.error{padding:34px;border:1px solid var(--line);border-radius:var(--r);background:#fff}.error{color:#8b2635}.mobile-toc{display:none;margin-top:16px}.mobile-toc details{position:relative;z-index:2;padding:12px 14px;border:1px solid rgba(255,255,255,.25);border-radius:14px;background:rgba(255,255,255,.1)}.mobile-toc summary{cursor:pointer;font-weight:750}.mobile-toc nav{display:grid;gap:8px;margin-top:12px}.mobile-toc a{color:#fff;text-decoration:none;font-size:.9rem}.footer{padding:26px 4px 0;text-align:center;color:var(--muted);font-size:.88rem}@media(max-width:960px){.layout{grid-template-columns:1fr}.toc{display:none}.mobile-toc{display:block}}@media(max-width:680px){.page{width:min(100% - 18px,1240px);padding-top:9px}.hero{border-radius:0 0 24px 24px;padding:28px 21px}.content-card{padding:23px 19px;border-radius:18px}.content-card>h1,.content-card>h2{font-size:1.45rem}}@media print{body{background:#fff}.page{width:100%;padding:0}.hero{box-shadow:none;border-radius:0}.layout{display:block}.toc,.mobile-toc,.hero-actions{display:none}.content-card{break-inside:avoid;box-shadow:none;margin-bottom:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<div class="page">
<header class="hero">
<p class="kicker">Human Performance Laboratory</p>
<h1>Dr. Gianluca Vernillo — Complete Meeting Prep</h1>
<div id="heroIntro" class="hero-intro"></div>
<div class="hero-actions"><button class="btn" type="button" onclick="window.print()">Print / Save PDF</button></div>
<div class="mobile-toc"><details><summary>Jump to a section</summary><nav id="mobileNav"></nav></details></div>
</header>
<div class="layout">
<aside class="toc"><p class="toc-title">22 sections</p><nav id="desktopNav"></nav></aside>
<main id="article"><div class="loading">Loading the complete notes…</div></main>
</div>
<footer class="footer">Complete meeting-preparation notes</footer>
</div>
<script>
const files=['vernillo-content/01.md','vernillo-content/02.md','vernillo-content/03.md','vernillo-content/04.md','vernillo-content/05.md','vernillo-content/06.md','vernillo-content/07.md','vernillo-content/08.md'];
const slugify=s=>s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim().replace(/[\s_]+/g,'-');
function navLink(h){const m=h.textContent.trim().match(/^(\d+)\.\s*(.*)$/);const a=document.createElement('a');a.href='#'+h.id;if(m){a.innerHTML='<span class="toc-num">'+m[1]+'</span><span>'+m[2].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span>'}else{a.textContent=h.textContent}return a}
async function init(){try{
 if(!window.marked)throw new Error('The Markdown renderer did not load.');
 const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error('Could not load '+f);return r.text()}));
 const source=document.createElement('div');source.innerHTML=marked.parse(parts.join('\n\n'),{gfm:true});
 const first=[...source.children].find(el=>el.tagName==='P');if(first)document.getElementById('heroIntro').appendChild(first);
 const flow=document.createElement('div');flow.className='article-flow';let card=null;const heads=[];
 [...source.childNodes].forEach(node=>{if(node.nodeType===1&&(node.tagName==='H1'||node.tagName==='H2')){card=document.createElement('section');card.className='content-card';flow.appendChild(card);let base=slugify(node.textContent)||'section',id=base,n=2;while(document.getElementById(id)){id=base+'-'+n++}node.id=id;heads.push(node)}if(!card){card=document.createElement('section');card.className='content-card';flow.appendChild(card)}card.appendChild(node)});
 const article=document.getElementById('article');article.innerHTML='';article.appendChild(flow);
 const d=document.getElementById('desktopNav'),m=document.getElementById('mobileNav');heads.forEach(h=>{d.appendChild(navLink(h));m.appendChild(navLink(h))});
 }catch(e){document.getElementById('article').innerHTML='<div class="error"><strong>Could not load the complete notes.</strong><br>'+e.message+'</div>';console.error(e)}}
init();
</script>
</body>
</html>
