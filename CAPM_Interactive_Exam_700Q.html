<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>CAPM Interactive Exam — 700 Questions</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f8f9fc;--text:#182033;--muted:#687087;--line:#dfe3ec;--primary:#3856d6;--primary2:#e9edff;--good:#19764b;--goodbg:#e9f7f0;--bad:#b42318;--badbg:#fff0ee;--warn:#9a6700;--warnbg:#fff7db;--flag:#b54708;--shadow:0 8px 28px rgba(24,32,51,.08);--radius:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topbar-inner{max-width:1280px;margin:auto;padding:11px 18px;display:flex;gap:14px;align-items:center}.brand{font-weight:800;letter-spacing:-.02em;white-space:nowrap}.top-meta{min-width:0;display:flex;gap:12px;align-items:center;margin-left:auto;color:var(--muted);font-size:14px}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.app{max-width:1280px;margin:auto;padding:24px 18px 48px}.home-head{max-width:850px;margin:20px auto 24px;text-align:center}.home-head h1{font-size:clamp(28px,5vw,48px);line-height:1.08;margin:0 0 12px;letter-spacing:-.04em}.home-head p{color:var(--muted);font-size:17px;margin:0}.source-note{margin:18px auto 0;max-width:760px;background:var(--primary2);border:1px solid #cdd6ff;border-radius:12px;padding:12px 14px;font-size:14px;text-align:left}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:700;min-height:44px}.btn:hover{border-color:#bdc4d5}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}.btn.small{padding:7px 10px;min-height:36px;font-size:13px}.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.test-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.test-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}.test-card .kicker{text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:800;color:var(--primary)}.test-card h2{font-size:18px;line-height:1.25;margin:0}.test-card .count{color:var(--muted);font-size:14px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.resume-note{font-size:12px;color:var(--good);font-weight:700}
.settings{max-width:760px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.settings h3{margin:0 0 12px}.settings-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700}.field input{width:150px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 11px;min-height:44px}.help{color:var(--muted);font-size:13px}
.exam-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}.palette{position:sticky;top:72px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 95px);overflow:auto}.palette h3{font-size:14px;margin:0 0 10px}.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qdot{aspect-ratio:1;border:1px solid var(--line);background:var(--surface2);border-radius:8px;font-size:12px;font-weight:800;color:var(--muted)}.qdot.current{outline:2px solid var(--primary);outline-offset:1px;color:var(--primary)}.qdot.answered{background:var(--primary2);color:var(--primary);border-color:#c8d2ff}.qdot.flagged{box-shadow:inset 0 -4px 0 #f79009}.qdot.correct{background:var(--goodbg);color:var(--good);border-color:#98d6b7}.qdot.incorrect{background:var(--badbg);color:var(--bad);border-color:#f3b0aa}.palette-legend{display:grid;gap:6px;margin-top:12px;color:var(--muted);font-size:12px}.legend-row{display:flex;gap:8px;align-items:center}.legend-box{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.exam-main{min-width:0}.exam-titlebar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.exam-titlebar h2{font-size:17px;margin:0}.progress-track{height:7px;background:#e9ecf2;border-radius:99px;overflow:hidden;flex:1;min-width:140px}.progress-fill{height:100%;background:var(--primary);width:0}.progress-text{font-size:13px;color:var(--muted);font-weight:700}
.question-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.qhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}.qnumber{font-weight:800}.badge{font-size:12px;font-weight:800;border-radius:99px;padding:4px 9px;background:var(--surface2);color:var(--muted)}.badge.flag{background:#fff2e8;color:var(--flag)}.qcontent{padding:20px}.qcontent p:first-child{margin-top:0}.qcontent p:last-child{margin-bottom:0}.qcontent img,.source-content img,.answer-panel img{display:block;max-width:100%;height:auto;margin:16px auto}.qcontent table,.answer-panel table,.source-content table{width:100%;border-collapse:collapse;margin:16px 0;overflow:auto}.qcontent th,.qcontent td,.answer-panel th,.answer-panel td,.source-content th,.source-content td{border:1px solid var(--line);padding:9px;vertical-align:top}.qcontent ol,.qcontent ul,.answer-panel ol,.answer-panel ul{padding-left:24px}
.choices{display:grid;gap:10px;margin-top:18px}.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface);transition:.15s}.choice:hover{border-color:#b8c1d5;background:var(--surface2)}.choice.selected{border-color:var(--primary);background:var(--primary2)}.choice input{margin-top:5px;transform:scale(1.16)}.choice-content{min-width:0;flex:1}.choice-content p,.choice-content li{margin:0}.choice-letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--surface2);border:1px solid var(--line);font-weight:800;flex:0 0 auto}.choice.selected .choice-letter{background:var(--primary);color:#fff;border-color:var(--primary)}
.mapping{margin-top:18px;display:grid;gap:10px}.map-row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(180px,1fr);gap:12px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}.map-target{font-weight:700}.map-row select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:9px}
.source-issue{margin:16px 0 0;background:var(--warnbg);border:1px solid #f0d98b;color:#634600;border-radius:12px;padding:12px 14px;font-size:13px}.study-feedback{margin-top:16px;border-radius:12px;padding:12px 14px;font-weight:800}.study-feedback.good{background:var(--goodbg);color:var(--good)}.study-feedback.bad{background:var(--badbg);color:var(--bad)}.study-feedback.warn{background:var(--warnbg);color:var(--warn)}
.answer-panel{margin-top:16px;border-top:1px solid var(--line);padding:18px 20px;background:#fbfcff}.answer-panel h3{margin:0 0 10px;font-size:15px}.answer-panel p:first-child{margin-top:0}
.qfooter{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.qfooter .spacer{flex:1}.navbtn{min-width:108px}.flagbtn.active{background:#fff2e8;border-color:#ffcaa2;color:var(--flag)}
.results{max-width:920px;margin:auto}.score-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;text-align:center}.score-big{font-size:54px;font-weight:900;letter-spacing:-.05em;line-height:1}.score-sub{color:var(--muted);margin-top:6px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px}.result-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.guide{margin-top:16px;text-align:left;background:var(--primary2);border:1px solid #cdd6ff;border-radius:12px;padding:14px}.guide h3{margin:0 0 8px;font-size:15px}.guide p{margin:4px 0;font-size:13px}.manual-review{margin-top:16px;text-align:left;background:var(--warnbg);border:1px solid #edd381;border-radius:12px;padding:14px}.manual-item{padding:10px 0;border-top:1px solid rgba(154,103,0,.18)}.manual-item:first-of-type{border-top:0}.manual-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.review-list{display:grid;gap:14px;margin-top:18px}.review-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.review-head{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.review-card.correct{border-left:5px solid var(--good)}.review-card.incorrect{border-left:5px solid var(--bad)}.review-card.pending{border-left:5px solid #f0a000}.review-body{padding:16px}.response-line{font-size:13px;color:var(--muted);margin:8px 0}.review-answer{margin-top:12px;background:var(--surface2);border-radius:12px;padding:14px}.review-answer summary{cursor:pointer;font-weight:800}
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;overflow:auto}.modal-card{background:var(--surface);width:min(980px,100%);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.25);border:1px solid var(--line);overflow:hidden}.modal-head{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:2}.modal-head h2{margin:0;font-size:18px}.modal-head .spacer{flex:1}.modal-body{padding:18px}.source-section{padding:18px 0;border-bottom:1px solid var(--line)}.source-section:last-child{border-bottom:0}.source-cover img{max-width:420px!important}.source-content h1,.source-content h2{font-size:20px}.source-content a{color:inherit;text-decoration:none}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:#172033;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px}
@media(max-width:1000px){.test-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.exam-layout{grid-template-columns:1fr}.palette{position:static;max-height:none}.palette-grid{grid-template-columns:repeat(10,1fr)}}
@media(max-width:650px){.app{padding:14px 10px 34px}.topbar-inner{padding:10px}.brand{font-size:14px}.top-meta .mode-name{display:none}.test-grid{grid-template-columns:1fr}.home-head{margin-top:10px}.settings{padding:14px}.palette-grid{grid-template-columns:repeat(5,1fr)}.qcontent{padding:16px}.qhead{padding:14px 16px}.qfooter{padding:12px}.map-row{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.navbtn{min-width:0;flex:1}.top-meta{gap:8px;font-size:12px}.exam-titlebar{padding:12px}.modal{padding:10px}.modal-body{padding:14px}}
@media(prefers-color-scheme:dark){:root{--bg:#0f131d;--surface:#171c28;--surface2:#1d2432;--text:#eff2f8;--muted:#abb3c4;--line:#30394a;--primary:#8297ff;--primary2:#222d58;--good:#68d39c;--goodbg:#163627;--bad:#ff8d84;--badbg:#42201e;--warn:#ffd261;--warnbg:#3c3217;--shadow:0 8px 28px rgba(0,0,0,.25)}.topbar{background:rgba(23,28,40,.94)}.answer-panel{background:#151a25}.choice.selected .choice-letter{color:#111}.source-issue{color:#ffe5a3}.btn.primary{color:#111}.btn.good{color:#111}}
@media print{.topbar,.palette,.qfooter,.toolbar,.btn,.settings{display:none!important}.app{max-width:none;padding:0}.exam-layout{display:block}.question-card,.review-card,.score-hero{box-shadow:none;break-inside:avoid}.answer-panel,.review-answer{display:block!important}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><div class="brand">CAPM Interactive Exam</div><div class="top-meta"><span class="mode-name" id="topMode">700-question source edition</span><span id="topProgress"></span><span class="timer hidden" id="timer">00:00:00</span></div></div></header>
<main class="app" id="app"></main>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script>window.__CAPM_DATA="";</script>
<script src="capm-data/data-01.js"></script>
<script src="capm-data/data-02.js"></script>
<script src="capm-data/data-03.js"></script>
<script src="capm-data/data-04.js"></script>
<script src="capm-data/data-05.js"></script>
<script src="capm-data/data-06.js"></script>
<script src="capm-data/data-07.js"></script>
<script src="capm-data/data-08.js"></script>
<script src="capm-data/data-09.js"></script>
<script src="capm-data/data-10.js"></script>
<script src="capm-data/data-11.js"></script>
<script src="capm-data/data-12.js"></script>
<script src="capm-data/data-13.js"></script>
<script src="capm-data/data-14.js"></script>
<script>
(()=>{
'use strict';
if(!window.__CAPM_DATA)throw new Error('CAPM exam data failed to load');const DATA=JSON.parse(window.__CAPM_DATA);if(DATA.total!==700||DATA.sections.reduce((n,s)=>n+s.questions.length,0)!==700)throw new Error('CAPM source verification failed');window.__CAPM_DATA='';
const app=document.getElementById('app'),timerEl=document.getElementById('timer'),topProgress=document.getElementById('topProgress'),topMode=document.getElementById('topMode'),toast=document.getElementById('toast');
let timerHandle=null;
const state={screen:'home',sectionId:null,mode:'exam',index:0,responses:{},flags:{},checked:{},submitted:false,startedAt:null,elapsedBefore:0,timeLimitMin:null,manualGrades:{},reviewFilter:'all'};
const section=()=>DATA.sections.find(s=>s.id===state.sectionId);
const keyFor=(sid,mode)=>'capm-exam-v3:'+sid+':'+mode;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clone(v){return JSON.parse(JSON.stringify(v));}
function showToast(msg){toast.textContent=msg;toast.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.add('hidden'),1800)}
function elapsedMs(){return state.startedAt?state.elapsedBefore+(Date.now()-state.startedAt):state.elapsedBefore;}
function formatTime(ms){let sec=Math.max(0,Math.floor(ms/1000));const h=Math.floor(sec/3600);sec%=3600;const m=Math.floor(sec/60),s=sec%60;return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');}
function tick(){if(state.screen!=='exam'||state.submitted){timerEl.classList.add('hidden');return}timerEl.classList.remove('hidden');let ms=elapsedMs();if(state.timeLimitMin){const left=state.timeLimitMin*60000-ms;timerEl.textContent='⏱ '+formatTime(left);if(left<=0){submitExam(true);return}}else timerEl.textContent='⏱ '+formatTime(ms);}
function startTimer(){clearInterval(timerHandle);tick();timerHandle=setInterval(tick,1000)}
function stopTimer(){clearInterval(timerHandle);timerHandle=null;if(state.startedAt){state.elapsedBefore=elapsedMs();state.startedAt=null}}
function save(){if(!state.sectionId)return;const payload={...state,startedAt:null,elapsedBefore:elapsedMs()};try{localStorage.setItem(keyFor(state.sectionId,state.mode),JSON.stringify(payload));}catch(e){}}
function loadSaved(sid,mode){try{const raw=localStorage.getItem(keyFor(sid,mode));return raw?JSON.parse(raw):null}catch(e){return null}}
function clearSaved(sid,mode){try{localStorage.removeItem(keyFor(sid,mode))}catch(e){}}
function resetState(){stopTimer();Object.assign(state,{screen:'home',sectionId:null,mode:'exam',index:0,responses:{},flags:{},checked:{},submitted:false,startedAt:null,elapsedBefore:0,timeLimitMin:null,manualGrades:{},reviewFilter:'all'});timerEl.classList.add('hidden');topProgress.textContent='';topMode.textContent='700-question source edition';}
function responseFor(q){return state.responses[q.n]??(q.type==='mapping'?{}:[])}
function isAnswered(q){const r=responseFor(q);if(q.type==='mapping')return q.special.targets.every(t=>r[t[0]]);return Array.isArray(r)&&r.length>0}
function arraysEqual(a,b){a=[...(a||[])].sort();b=[...(b||[])].sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}
function gradeQuestion(q){if(q.manual){const g=state.manualGrades[q.n];return g===true?true:g===false?false:null}const r=responseFor(q);if(q.type==='mapping'){return q.special.targets.every(t=>r[t[0]]===q.special.correct[t[0]])}return arraysEqual(r,q.key)}
function totalAnswered(){return section().questions.filter(isAnswered).length}
function gradeStats(){const qs=section().questions;let correct=0,incorrect=0,pending=0,unanswered=0;for(const q of qs){if(q.manual&&state.manualGrades[q.n]===undefined){pending++;continue}if(!isAnswered(q)&&!q.manual){unanswered++;incorrect++;continue}const g=gradeQuestion(q);if(g===true)correct++;else if(g===false)incorrect++;else pending++;}return{correct,incorrect,pending,unanswered,total:qs.length,scored:qs.length-pending,percent:(qs.length-pending)>0?correct/(qs.length-pending)*100:0}}
function scoreGuide(p){if(p<50)return 'Less than 50%: You are not prepared enough. It’s highly recommended to thoroughly go through your studying materials again.';if(p<60)return 'Between 50% and 60%: You are still not there yet. It’s recommended that you concentrate on your knowledge gaps and retake your practice tests.';if(p<70)return 'Between 60% and 70%: You are almost there. If you still have time before the exam date, you can use it for more practice.';if(p<=80)return 'Between 70% and 80%: You’re prepared! You have a good chance now to pass the exam.';return 'More than 80%: You are perfectly prepared. With such a score, you’re more likely to hit an Above Target score in all domains!'}
function sourceInfoModal(){const wrap=document.createElement('div');wrap.className='modal';wrap.id='sourceModal';wrap.innerHTML='<div class="modal-card"><div class="modal-head"><h2>Original EPUB material</h2><div class="spacer"></div><button class="btn small" id="closeSource">Close</button></div><div class="modal-body source-content">'+DATA.sourceParts.map((p,i)=>'<section class="source-section" data-part="'+p.part+'">'+p.html+'</section>').join('')+'</div></div>';document.body.appendChild(wrap);wrap.querySelector('#closeSource').addEventListener('click',()=>wrap.remove());wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove()})}
function renderHome(){resetState();state.screen='home';const cards=DATA.sections.map(s=>{const ex=loadSaved(s.id,'exam'),st=loadSaved(s.id,'study');return `<article class="test-card"><div class="kicker">${esc(s.kind)}</div><h2>${esc(s.title)}</h2><div class="count">${s.count} questions</div>${ex||st?'<div class="resume-note">Saved attempt available</div>':''}<div class="card-actions"><button class="btn primary start" data-id="${s.id}" data-mode="exam">Start exam</button><button class="btn start" data-id="${s.id}" data-mode="study">Study mode</button>${ex?`<button class="btn small resume" data-id="${s.id}" data-mode="exam">Resume exam</button>`:''}${st?`<button class="btn small resume" data-id="${s.id}" data-mode="study">Resume study</button>`:''}</div></article>`}).join('');
app.innerHTML=`<section class="home-head"><h1>700 questions, rebuilt as an exam.</h1><p>The EPUB supplies the question wording, choices, figures, answer keys, and explanations. This file turns that source into an interactive exam/study interface without replacing the source content.</p><div class="source-note"><strong>Included:</strong> all 4 domain-focused practice tests and all 4 full 150-question mock exams, plus the original EPUB front/back matter in the “Original EPUB material” panel. Visual and matching questions use source-derived interactive mappings.</div></section><div class="toolbar"><button class="btn" id="sourceBtn">Original EPUB material</button></div><section class="settings"><h3>Exam timer</h3><div class="settings-row"><div class="field"><label for="limit">Optional time limit (minutes)</label><input id="limit" type="number" min="1" max="1440" placeholder="Untimed"></div><div class="help">The EPUB says the full mocks are intended for time-management practice but does not specify a duration, so no time limit is assumed.</div></div></section><section class="test-grid">${cards}</section>`;
document.getElementById('sourceBtn').onclick=sourceInfoModal;app.querySelectorAll('.start').forEach(b=>b.onclick=()=>begin(b.dataset.id,b.dataset.mode,false));app.querySelectorAll('.resume').forEach(b=>b.onclick=()=>begin(b.dataset.id,b.dataset.mode,true));}
function begin(id,mode,resume){const s=DATA.sections.find(x=>x.id===id);if(!s)return;const saved=resume?loadSaved(id,mode):null;const limitInput=document.getElementById('limit');const lim=limitInput&&limitInput.value?Math.max(1,parseInt(limitInput.value,10)||0):null;Object.assign(state,{screen:'exam',sectionId:id,mode,index:0,responses:{},flags:{},checked:{},submitted:false,startedAt:Date.now(),elapsedBefore:0,timeLimitMin:lim,manualGrades:{},reviewFilter:'all'});if(saved){Object.assign(state,saved,{sectionId:id,mode});if(saved.submitted){state.screen='results';state.startedAt=null;topMode.textContent='Results • '+s.title;renderResults();return}state.screen='exam';state.startedAt=Date.now();}else clearSaved(id,mode);topMode.textContent=(mode==='exam'?'Exam':'Study')+' • '+s.title;renderExam();startTimer();save();}
function paletteHtml(){const s=section();return `<aside class="palette"><h3>Question navigator</h3><div class="palette-grid">${s.questions.map((q,i)=>{let cls='qdot';if(i===state.index)cls+=' current';if(isAnswered(q))cls+=' answered';if(state.flags[q.n])cls+=' flagged';if(state.submitted){const g=gradeQuestion(q);if(g===true)cls+=' correct';else if(g===false)cls+=' incorrect'}return `<button class="${cls}" data-i="${i}" aria-label="Question ${q.n}">${q.n}</button>`}).join('')}</div><div class="palette-legend"><div class="legend-row"><span class="legend-box" style="background:var(--primary2)"></span>Answered</div><div class="legend-row"><span class="legend-box" style="box-shadow:inset 0 -4px 0 #f79009"></span>Flagged</div></div><div class="toolbar" style="justify-content:flex-start;margin:14px 0 0"><button class="btn small" id="homeBtn">Exit / save</button>${state.mode==='exam'?'<button class="btn small primary" id="submitBtn">Submit exam</button>':''}</div></aside>`}
function renderResponse(q){const r=responseFor(q);if(q.type==='mapping'){return `<div class="mapping" role="group" aria-label="Matching response">${q.special.targets.map(t=>`<label class="map-row"><span class="map-target">${esc(t[1])}</span><select data-target="${esc(t[0])}"><option value="">Choose…</option>${q.special.options.map(o=>`<option value="${esc(o[0])}" ${r[t[0]]===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`).join('')}</div>`}
const inputType=q.type==='multi'?'checkbox':'radio';return `<div class="choices" role="group" aria-label="Answer choices">${q.choices.map(c=>{const sel=(r||[]).includes(c.id);return `<label class="choice ${sel?'selected':''}"><input type="${inputType}" name="q${q.n}" value="${c.id}" ${sel?'checked':''}><span class="choice-letter">${c.id}</span><span class="choice-content">${c.html}</span></label>`}).join('')}</div>`}
function responseSummary(q){const r=responseFor(q);if(q.type==='mapping'){if(!Object.keys(r).length)return 'No response';return q.special.targets.map(t=>{const opt=q.special.options.find(o=>o[0]===r[t[0]]);return `${t[0]} → ${opt?opt[1]:'—'}`}).join('; ')}return r.length?r.join(', '):'No response'}
function correctSummary(q){if(q.manual)return 'Manual review required';if(q.type==='mapping')return q.special.targets.map(t=>{const id=q.special.correct[t[0]],opt=q.special.options.find(o=>o[0]===id);return `${t[0]} → ${opt?opt[1]:id}`}).join('; ');return q.key.join(', ')}
function renderQuestion(q){const checked=!!state.checked[q.n],g=checked?gradeQuestion(q):null;let feedback='';if(state.mode==='study'&&checked){feedback=q.manual?'<div class="study-feedback warn">Source conflict — review this item manually.</div>':`<div class="study-feedback ${g?'good':'bad'}">${g?'Correct':'Not correct yet'} • Your response: ${esc(responseSummary(q))}</div>`}
const answerVisible=state.mode==='study'&&checked;return `<article class="question-card"><div class="qhead"><span class="qnumber">Question ${q.n}</span><span class="badge">${q.type==='single'?'Single choice':q.type==='multi'?'Multiple selection':'Matching / ordering'}</span>${state.flags[q.n]?'<span class="badge flag">Flagged</span>':''}</div><div class="qcontent">${q.stemHtml}${renderResponse(q)}${q.sourceIssue?`<div class="source-issue"><strong>Source note:</strong> ${esc(q.sourceIssue)}</div>`:''}${feedback}</div>${answerVisible?`<section class="answer-panel"><h3>Source answer & explanation</h3>${q.answerHtml}</section>`:''}<footer class="qfooter"><button class="btn flagbtn ${state.flags[q.n]?'active':''}" id="flagBtn">${state.flags[q.n]?'Unflag':'Flag for review'}</button>${state.mode==='study'?'<button class="btn" id="checkBtn">Check answer</button>':''}<div class="spacer"></div><button class="btn navbtn" id="prevBtn" ${state.index===0?'disabled':''}>Previous</button><button class="btn primary navbtn" id="nextBtn">${state.index===section().count-1?(state.mode==='exam'?'Submit':'Finish'):'Next'}</button></footer></article>`}
function renderExam(){state.screen='exam';const s=section(),q=s.questions[state.index],answered=totalAnswered(),pct=(state.index+1)/s.count*100;topProgress.textContent=`${answered}/${s.count} answered`;app.innerHTML=`<div class="exam-layout">${paletteHtml()}<section class="exam-main"><div class="exam-titlebar"><h2>${esc(s.title)}</h2><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-text">${state.index+1} / ${s.count}</span></div>${renderQuestion(q)}</section></div>`;wireExam(q);}
function wireExam(q){app.querySelectorAll('.qdot').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.i);save();renderExam()});const home=document.getElementById('homeBtn');if(home)home.onclick=()=>{save();stopTimer();renderHome()};const sub=document.getElementById('submitBtn');if(sub)sub.onclick=()=>submitExam(false);document.getElementById('flagBtn').onclick=()=>{state.flags[q.n]=!state.flags[q.n];save();renderExam()};const prev=document.getElementById('prevBtn');if(prev)prev.onclick=()=>{if(state.index>0){state.index--;save();renderExam()}};document.getElementById('nextBtn').onclick=()=>{if(state.index<section().count-1){state.index++;save();renderExam()}else if(state.mode==='exam')submitExam(false);else{save();showToast('End of study set')}};const check=document.getElementById('checkBtn');if(check)check.onclick=()=>{state.checked[q.n]=true;save();renderExam()};
if(q.type==='mapping'){app.querySelectorAll('select[data-target]').forEach(sel=>sel.onchange=()=>{const r={...(state.responses[q.n]||{})};if(sel.value)r[sel.dataset.target]=sel.value;else delete r[sel.dataset.target];state.responses[q.n]=r;state.checked[q.n]=false;save();renderExam()})}else{app.querySelectorAll('.choice input').forEach(inp=>inp.onchange=()=>{let r=[...(state.responses[q.n]||[])];if(q.type==='single')r=inp.checked?[inp.value]:[];else if(inp.checked&&!r.includes(inp.value))r.push(inp.value);else if(!inp.checked)r=r.filter(x=>x!==inp.value);state.responses[q.n]=r;state.checked[q.n]=false;save();renderExam()})}}
function submitExam(auto){if(state.mode!=='exam')return;if(!auto){const unanswered=section().questions.filter(q=>!isAnswered(q)).length;const msg=unanswered?`Submit now? ${unanswered} question${unanswered===1?' is':'s are'} unanswered.`:'Submit this exam now?';if(!confirm(msg))return}stopTimer();state.submitted=true;state.screen='results';save();renderResults(auto)}
function renderResults(auto=false){state.screen='results';timerEl.classList.add('hidden');const s=section(),st=gradeStats(),pct=st.percent;topMode.textContent='Results • '+s.title;topProgress.textContent='';const pendingQs=s.questions.filter(q=>q.manual&&state.manualGrades[q.n]===undefined);const guide=s.kind==='Full Mock Exam'&&st.pending===0?`<div class="guide"><h3>Source score guidance</h3><p>${esc(scoreGuide(pct))}</p><p class="help">The EPUB result sheet instructs: “Assign ‘1’ point to each question answered correctly, and then count your points to get your final score.”</p></div>`:'';const manual=pendingQs.length?`<div class="manual-review"><strong>${pendingQs.length} source-conflict question${pendingQs.length>1?'s':''} need manual grading before a complete score is available.</strong>${pendingQs.map(q=>`<div class="manual-item"><div><strong>Question ${q.n}</strong></div><div class="help">${esc(q.sourceIssue)}</div><div class="manual-actions"><button class="btn small good manualGrade" data-q="${q.n}" data-v="1">Count as correct</button><button class="btn small manualGrade" data-q="${q.n}" data-v="0">Count as incorrect</button><button class="btn small reviewOne" data-q="${q.n}">Review question</button></div></div>`).join('')}</div>`:'';
app.innerHTML=`<section class="results"><div class="score-hero"><div class="score-big">${st.pending?'—':pct.toFixed(1)+'%'}</div><div class="score-sub">${st.pending?`${st.correct} correct so far • ${st.pending} pending manual review`:`${st.correct} / ${st.total} correct`}</div><div class="stats"><div class="stat"><strong>${st.correct}</strong>Correct</div><div class="stat"><strong>${st.incorrect}</strong>Incorrect</div><div class="stat"><strong>${st.unanswered}</strong>Unanswered</div><div class="stat"><strong>${formatTime(state.elapsedBefore)}</strong>Time</div></div>${auto?'<div class="source-issue">Time limit reached; the exam was submitted automatically.</div>':''}${manual}${guide}<div class="result-actions"><button class="btn primary" id="reviewBtn">Review answers</button><button class="btn" id="retryBtn">Retake</button><button class="btn" id="resultsHome">Home</button></div></div></section>`;app.querySelector('#reviewBtn').onclick=()=>renderReview();app.querySelector('#retryBtn').onclick=()=>{clearSaved(s.id,state.mode);begin(s.id,state.mode,false)};app.querySelector('#resultsHome').onclick=renderHome;app.querySelectorAll('.manualGrade').forEach(b=>b.onclick=()=>{state.manualGrades[Number(b.dataset.q)]=b.dataset.v==='1';save();renderResults()});app.querySelectorAll('.reviewOne').forEach(b=>b.onclick=()=>renderReview(Number(b.dataset.q)));}
function renderReview(jumpQ){state.screen='review';const s=section();topMode.textContent='Review • '+s.title;const filters=['all','incorrect','flagged','unanswered'];const filtered=s.questions.filter(q=>{if(jumpQ)return q.n===jumpQ;if(state.reviewFilter==='flagged')return !!state.flags[q.n];if(state.reviewFilter==='unanswered')return !isAnswered(q);if(state.reviewFilter==='incorrect')return gradeQuestion(q)===false;return true});app.innerHTML=`<section class="results"><div class="exam-titlebar"><h2>Answer review</h2><div class="spacer"></div><button class="btn" id="backResults">Back to results</button></div><div class="toolbar" style="justify-content:flex-start">${filters.map(f=>`<button class="btn small reviewFilter ${state.reviewFilter===f?'primary':''}" data-f="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div><div class="review-list">${filtered.map(q=>{const g=gradeQuestion(q),cls=g===true?'correct':g===false?'incorrect':'pending';return `<article class="review-card ${cls}" id="review-q-${q.n}"><div class="review-head"><strong>Question ${q.n}</strong><span class="badge">${g===true?'Correct':g===false?'Incorrect':'Pending manual grade'}</span>${state.flags[q.n]?'<span class="badge flag">Flagged</span>':''}</div><div class="review-body">${q.stemHtml}<div class="response-line"><strong>Your response:</strong> ${esc(responseSummary(q))}</div><div class="response-line"><strong>Correct response:</strong> ${esc(correctSummary(q))}</div>${q.sourceIssue?`<div class="source-issue"><strong>Source note:</strong> ${esc(q.sourceIssue)}</div>`:''}<details class="review-answer" open><summary>Source answer & explanation</summary><div>${q.answerHtml}</div></details>${q.manual&&state.manualGrades[q.n]===undefined?`<div class="manual-actions"><button class="btn small good manualGrade" data-q="${q.n}" data-v="1">Count as correct</button><button class="btn small manualGrade" data-q="${q.n}" data-v="0">Count as incorrect</button></div>`:''}</div></article>`}).join('')||'<div class="test-card">No questions match this filter.</div>'}</div></section>`;document.getElementById('backResults').onclick=()=>renderResults();app.querySelectorAll('.reviewFilter').forEach(b=>b.onclick=()=>{state.reviewFilter=b.dataset.f;renderReview()});app.querySelectorAll('.manualGrade').forEach(b=>b.onclick=()=>{state.manualGrades[Number(b.dataset.q)]=b.dataset.v==='1';save();renderReview(jumpQ)});}
renderHome();
})();
</script>
</body>
</html>
